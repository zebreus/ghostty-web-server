name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Required for creating GitHub releases

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

  create-release:
    name: create release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  publish-binaries:
    name: build binary (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: create-release
    strategy:
      matrix:
        platform: [linux-x64, linux-arm64, darwin-x64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build:bin:${{ matrix.platform }}

      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" dist/ghostty-web-server-${{ matrix.platform }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
