name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: mlugg/setup-zig@v2.0.5
        with:
          version: 0.14.1

      - run: zig build -Doptimize=ReleaseFast

  create-release:
    name: create release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  publish-binaries:
    name: build binary (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-linux-gnu
          - platform: linux-arm64
            os: ubuntu-latest
            target: aarch64-linux-gnu
          - platform: darwin-x64
            os: macos-13
            target: x86_64-macos
          - platform: darwin-arm64
            os: macos-14
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: mlugg/setup-zig@v2.0.5
        with:
          version: 0.14.1

      - run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - run: cp zig-out/bin/ghostty-web-server ghostty-web-server-${{ matrix.platform }}

      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" ghostty-web-server-${{ matrix.platform }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish-release:
    name: publish release
    runs-on: ubuntu-latest
    needs: publish-binaries
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Publish GitHub Release
        run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
