name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  publish-binaries:
    name: build binary (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
          - platform: darwin-x64
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: 'latest'

      - name: Install cargo-zigbuild
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild

      - name: Build client (wasm)
        working-directory: client
        run: trunk build --release

      - name: Build server (${{ matrix.target }})
        run: cargo zigbuild --release --target ${{ matrix.target }} -p ghostty-web-server

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ghostty-web-server \
             dist/ghostty-web-server-${{ matrix.platform }}

      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" dist/ghostty-web-server-${{ matrix.platform }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish-release:
    name: publish release
    runs-on: ubuntu-latest
    needs: publish-binaries
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Publish GitHub Release
        run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
