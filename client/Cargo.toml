[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
gloo-net = { version = "0.6", features = ["http", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-events = "0.2"
gloo-utils = "0.2"
gloo-storage = "0.3"
futures = "0.3"
log = "0.4"
console_log = { version = "1", features = ["color"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "js"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlDivElement",
  "DomRect",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "MouseEvent",
  "WheelEvent",
  "ClipboardEvent",
  "DataTransfer",
  "Location",
  "Storage",
  "ResizeObserver",
  "ResizeObserverEntry",
  "ResizeObserverBoxOptions",
  "ResizeObserverOptions",
  "WebSocket",
  "MessageEvent",
  "CloseEvent",
  "BinaryType",
  "AudioContext",
  "AudioContextOptions",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "BaseAudioContext",
  "GainNode",
  "OscillatorNode",
  "Performance",
  "Url",
  "UrlSearchParams",
  "console",
  "DomTokenList",
  "CssStyleDeclaration",
]
